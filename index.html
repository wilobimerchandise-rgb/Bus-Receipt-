<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHISCO Bus Ticket Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');

    body {
        font-family: 'Anton', 'Impact', sans-serif;
        background: #f0f0f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        gap: 20px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .form {
        width: 320px;
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .form h3 { margin: 0 0 15px 0; text-align: center; font-size: 16px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; margin-bottom: 3px; }
    .form-group input { width: 100%; padding: 6px; font-family: 'Courier New'; text-transform: none; }
    .btn { width: 100%; padding: 10px; background: #000; color: white; border: none; font-family: 'Anton'; font-size: 16px; cursor: pointer; }

    /* TICKET DESIGN - EXACT THERMAL RECEIPT */
    .ticket {
        width: 280px; /* 80mm thermal paper */
        background: white;
        padding: 8px 12px;
        font-size: 11px;
        line-height: 1.3;
        color: #000;
        font-weight: 900;
    }
    .ticket-logo {
        font-family: 'Anton', sans-serif;
        font-size: 38px;
        text-align: center;
        font-weight: 900;
        transform: skewX(-12deg);
        margin-bottom: 2px;
        letter-spacing: 3px;
    }
    .ticket-title {
        text-align: center;
        font-size: 10px;
        margin-bottom: 8px;
        letter-spacing: 1px;
    }
    .ticket-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 3px;
    }
    .ticket-label { width: 35%; }
    .ticket-value { width: 65%; text-align: right; }
    .divider { border-top: 1px dashed #000; margin: 6px 0; }
    .ticket-note {
        font-size: 8px;
        text-align: center;
        line-height: 1.2;
        margin-top: 8px;
        text-transform: none;
        font-family: Arial, sans-serif;
        font-weight: 400;
        padding: 0 5px;
    }
    .hidden { display: none; }
    .no-print { }
</style>
</head>
<body>

<div class="form" id="inputForm">
    <h3>Generate CHISCO Ticket</h3>
    <div class="form-group"><label>Route</label><input id="route" value="Mile 1----PM ==> JIBOWU--AM"></div>
    <div class="form-group"><label>Fare</label><input id="fare" value="45000.00"></div>
    <div class="form-group"><label>Veh No</label><input id="veh" value="AGU 443 XB"></div>
    <div class="form-group"><label>Date</label><input id="date" type="date"></div>
    <div class="form-group"><label>Time</label><input id="time" type="time"></div>
    <div class="form-group"><label>Ref#</label><input id="ref" value="MI3028D04BTMA"></div>
    <div class="form-group"><label>Name</label><input id="name" value="OBIORA"></div>
    <div class="form-group"><label>Seat No</label><input id="seat" value="31"></div>
    <div class="form-group"><label>Luggage</label><input id="luggage" value="0.00"></div>
    <button class="btn" onclick="generateTicket()">GENERATE & DOWNLOAD TICKET</button>
</div>

<div class="ticket hidden" id="ticket">
    <div class="ticket-logo">CHISCO</div>
    <div class="ticket-title">BUS TICKET</div>
    
    <div class="ticket-row"><div class="ticket-label">ROUTE:</div><div class="ticket-value" id="t_route"></div></div>
    <div class="ticket-row"><div class="ticket-label">FARE:</div><div class="ticket-value" id="t_fare"></div></div>
    <div class="ticket-row"><div class="ticket-label">VEH NO.:</div><div class="ticket-value" id="t_veh"></div></div>
    <div class="ticket-row"><div class="ticket-label">DATE:</div><div class="ticket-value" id="t_date"></div></div>
    <div class="ticket-row"><div class="ticket-label">TIME:</div><div class="ticket-value" id="t_time"></div></div>
    <div class="ticket-row"><div class="ticket-label">REF#:</div><div class="ticket-value" id="t_ref"></div></div>

    <div class="divider"></div>

    <div class="ticket-row"><div class="ticket-label">NAME:</div><div class="ticket-value" id="t_name"></div></div>
    <div class="ticket-row"><div class="ticket-label">SEAT NO.:</div><div class="ticket-value" id="t_seat"></div></div>

    <div class="divider"></div>

    <div class="ticket-row"><div class="ticket-label">LUGGAGE:</div><div class="ticket-value" id="t_luggage"></div></div>

    <div class="divider"></div>

    <div class="ticket-note">
        Note: Tickets are non-refundable after purchase<br>
        Luggage allowance is 0.8kg only. Kindly transfer excess<br>
        via logistics unit & enjoy extra 10kg for free<br>
        For enquires: 0000/00000
    </div>

    <div class="divider"></div>

    <div class="no-print">
        <button class="btn" onclick="window.print()">PRINT TICKET</button>
    </div>
</div>

<script>
document.getElementById('date').valueAsDate = new Date();
document.getElementById('time').value = "17:00";

function formatDate(dateStr){
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'}).toUpperCase();
}
function formatTime(timeStr){
    const [h, m] = timeStr.split(':');
    const ampm = h >= 12 ? 'PM' : 'AM';
    const hour = h % 12 || 12;
    return `${hour}:${m} ${ampm}`;
}

async function generateTicket(){
    document.getElementById('t_route').innerText = document.getElementById('route').value.toUpperCase();
    document.getElementById('t_fare').innerText = '₦' + parseFloat(document.getElementById('fare').value).toLocaleString('en-NG', {minimumFractionDigits: 2}) ;
    document.getElementById('t_veh').innerText = document.getElementById('veh').value.toUpperCase();
    document.getElementById('t_date').innerText = formatDate(document.getElementById('date').value);
    document.getElementById('t_time').innerText = formatTime(document.getElementById('time').value);
    document.getElementById('t_ref').innerText = document.getElementById('ref').value.toUpperCase();
    document.getElementById('t_name').innerText = document.getElementById('name').value.toUpperCase();
    document.getElementById('t_seat').innerText = document.getElementById('seat').value;
    document.getElementById('t_luggage').innerText = parseFloat(document.getElementById('luggage').value).toFixed(2);

    document.getElementById('inputForm').classList.add('hidden');
    document.getElementById('ticket').classList.remove('hidden');

    setTimeout(() => { downloadPDF(); }, 300);
}

async function downloadPDF(){
    const { jsPDF } = window.jspdf;
    const ticket = document.getElementById('ticket');
    
    const noPrintElements = ticket.querySelectorAll('.no-print');
    noPrintElements.forEach(el => el.style.display = 'none');

    const canvas = await html2canvas(ticket, {scale: 3, backgroundColor: '#ffffff'});
    const imgData = canvas.toDataURL('image/png');
    const pdf = new jsPDF({orientation: 'portrait', unit: 'mm', format: [80, 297]});
    const pdfWidth = 80;
    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
    
    let passengerName = document.getElementById('name').value.toUpperCase().trim();
    let fileName = `CHISCO TICKET (${passengerName}).pdf`;
    
    pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
    pdf.save(fileName);

    noPrintElements.forEach(el => el.style.display = 'block');
}
</script>
</body>
    </html>
